<!doctype html>

    <meta charset="UTF-8" />

    <meta name="theme-color" content="#06234f" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="De VERVE" />
    <style>
      #initial-brand-loader{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;overflow:hidden;isolation:isolate;background:#071a30;opacity:1;transition:opacity .18s ease-out}
      #initial-brand-loader::before{content:"";position:absolute;left:50%;top:50%;width:112px;height:112px;border:2px solid rgba(214,183,119,.18);border-top-color:#e1c58c;border-right-color:rgba(214,183,119,.62);border-radius:50%;transform:translate(-50%,-50%);animation:deverve-loader-spin .82s linear infinite;will-change:transform}
      #initial-brand-loader .initial-brand-logo{display:block;width:82px;height:82px;max-width:26vw;max-height:26vw;aspect-ratio:1;object-fit:contain;object-position:center;border:0;border-radius:50%;background:transparent;padding:0;box-shadow:none;overflow:hidden;animation:deverve-loader-breathe 1.35s ease-in-out infinite;will-change:transform,opacity}
      #initial-brand-loader.is-exiting{opacity:0;pointer-events:none}
      @keyframes deverve-loader-spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
      @keyframes deverve-loader-breathe{0%,100%{transform:scale(.96);opacity:.9}50%{transform:scale(1);opacity:1}}
      @media(prefers-reduced-motion:reduce){#initial-brand-loader{transition:none}#initial-brand-loader::before,#initial-brand-loader .initial-brand-logo{animation:none;will-change:auto}}
    </style>
    <link rel="manifest" href="/api/pwa/manifest" />
    <link rel="icon" href="/api/brand/logo" />
    <link rel="apple-touch-icon" href="/api/brand/logo" />
