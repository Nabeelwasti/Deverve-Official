name = "deverve-outbox"
main = "index.ts"
compatibility_date = "2026-11-25"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "deverve-production"
database_id = "355da876-17c4-4762-a59d-bb85f2e4551b"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "deverve-media-private"
