name: Build and type-check

# Keep main-branch release checks serial; cancel superseded pull-request runs so the latest revision is always tested.
concurrency:
  group: deverve-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture dependency audit report
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const report = JSON.parse(require("node:fs").readFileSync("npm-audit.json", "utf8")); const counts = report.metadata?.vulnerabilities || {}; console.log("Full dependency audit:", JSON.stringify(counts)); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(name + ": " + item.severity + ", direct=" + item.isDirect + ", fixAvailable=" + JSON.stringify(item.fixAvailable));'
      - name: Upload resolved dependency audit artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-${{ github.run_number }}
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Type-check and build
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Fail on high or critical vulnerabilities across all dependencies
        run: npm audit --audit-level=high
      - name: Verify Pages security headers are included in build output
        run: |
          test -s dist/_headers
          grep -q "Content-Security-Policy: default-src 'self'" dist/_headers
          grep -q "script-src 'self' https://challenges.cloudflare.com" dist/_headers
          grep -q "frame-src 'self' https://challenges.cloudflare.com" dist/_headers
          grep -q "connect-src 'self' https://challenges.cloudflare.com" dist/_headers
          grep -q "Permissions-Policy: camera=(self), microphone=(self), geolocation=()" dist/_headers
          expected_permissions="$(sed -n '/^[[:space:]]*Permissions-Policy:/s/^[[:space:]]*//p' public/_headers | head -n 1)"
          grep -Fq "\"$expected_permissions\"" .github/workflows/production-smoke.yml
      - name: Validate private translation Worker JavaScript syntax
        run: node --check workers/site-translation/index.js
      - name: Validate scheduled CNIC retention Worker and R2 lock gate syntax
        run: |
          node --check workers/deverve-cnic-retention.js
          node --check scripts/reconcile-cnic-r2-retention-lock.mjs
      - name: Validate backup freshness monitor syntax
        run: node --check scripts/backup-health-monitor.mjs
      - name: Validate independent application-secret provisioning syntax
        run: node --check scripts/provision-cloudflare-key-separation.mjs
      - name: Bundle scheduled Workers without deploying
        run: |
          npx --yes wrangler@4.45.0 deploy --dry-run --config workers/outbox/wrangler.toml
          npx --yes wrangler@4.45.0 deploy --dry-run --config workers/cnic-retention/wrangler.toml
      - name: Test Worker authentication and translation behavior
        run: npm run test:worker
      - name: Exercise offline POS lifecycle through the real Worker and isolated SQLite D1 adapter
        run: npm run test:offline:worker
      - name: Validate D1 schema and constraints
        run: python scripts/verify_schema.py
      - name: Validate isolated remote D1 integration suite syntax
        run: node --check scripts/d1-inventory.integration.test.mjs
      - name: Validate encrypted D1 backup script syntax
        run: node --check scripts/d1-backup-restore.mjs
      - name: Test encrypted private R2 media backup and recovery primitives
        run: node --test scripts/r2-media-backup.test.mjs
      - name: Validate encrypted private R2 media backup script syntax
        run: node --check scripts/r2-media-backup.mjs
      - name: Validate isolated offline POS D1 migration suite syntax
        run: node --check scripts/offline-pos-d1.integration.test.mjs
      - name: Run isolated remote D1 integration suite when credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            npm run test:d1:integration
          else
            echo "Skipping remote D1 integration: Cloudflare test credentials are not configured."
          fi
      - name: Run isolated offline POS D1 migration suite when credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            npm run test:offline:d1
          else
            echo "Skipping offline POS D1 migration suite: Cloudflare test credentials are not configured."
          fi
      - name: Rehearse offline POS migrations on an isolated production backup clone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: "355da876-17c4-4762-a59d-bb85f2e4551b"
          D1_DATABASE_NAME: "deverve-production"
          D1_BACKUP_R2_BUCKET: "deverve-db-backups"
          D1_BACKUP_ENCRYPTION_KEY: ${{ secrets.D1_BACKUP_ENCRYPTION_KEY }}
          D1_BACKUP_KEY_ID: "deverve-d1-key-v1"
          OFFLINE_POS_MIGRATION_CHECK: "true"
        run: node scripts/d1-backup-restore.mjs
      - name: Install Chromium headless shell for browser tests
        timeout-minutes: 8
        run: npx playwright install chromium --only-shell
      - name: Run storefront browser tests
        timeout-minutes: 12
        run: npm run test:e2e
