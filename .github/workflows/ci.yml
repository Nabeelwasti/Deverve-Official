name: Build and type-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run check
      - name: Validate D1 migration SQL
        run: python -c "import pathlib, sqlite3; db=sqlite3.connect(':memory:'); db.executescript(pathlib.Path('migrations/0001_initial.sql').read_text()); print('D1 migration SQL is valid')"
