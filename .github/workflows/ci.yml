name: Build and type-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Capture dependency lockfile and full audit report
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const report = JSON.parse(require("node:fs").readFileSync("npm-audit.json", "utf8")); const counts = report.metadata?.vulnerabilities || {}; console.log("Full dependency audit:", JSON.stringify(counts)); for (const [name, item] of Object.entries(report.vulnerabilities || {})) console.log(name + ": " + item.severity + ", direct=" + item.isDirect + ", fixAvailable=" + JSON.stringify(item.fixAvailable));'
      - name: Upload resolved dependency audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_number }}
          path: |
            package-lock.json
            npm-audit.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit the generated lockfile once and verify npm ci
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            sed -i 's/run: npm install/run: npm ci/' .github/workflows/ci.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json .github/workflows/ci.yml
            git commit -m "[CF-Pages-Skip] Add deterministic npm lockfile and use npm ci"
            git push origin HEAD:main
            npm ci
          fi
      - name: Type-check and build
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Pages security headers are included in build output
        run: |
          test -s dist/_headers
          grep -q "Content-Security-Policy: default-src 'self'" dist/_headers
          grep -q "script-src 'self' https://challenges.cloudflare.com" dist/_headers
          grep -q "frame-src 'self' https://challenges.cloudflare.com" dist/_headers
      - name: Test Worker authentication behavior
        run: npm run test:worker
      - name: Validate D1 schema and constraints
        run: python scripts/verify_schema.py
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run storefront browser tests
        run: npm run test:e2e
