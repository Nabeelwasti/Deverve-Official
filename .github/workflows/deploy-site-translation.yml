name: Deploy private site translation service

on:
  push:
    branches: [main]
    paths:
      - "workers/site-translation/**"
      - ".github/workflows/deploy-site-translation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deverve-site-translation-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate translation Worker
        run: node --check workers/site-translation/index.js

      - name: Prepare private Workers AI binding metadata
        shell: bash
        run: |
          cat > translation-worker-metadata.json <<'EOF'
          {
            "main_module": "index.js",
            "compatibility_date": "2026-11-13",
            "bindings": [
              { "type": "ai", "name": "AI" }
            ],
            "workers_dev": false,
            "preview_urls": false,
            "observability": { "enabled": false }
          }
          EOF

      - name: Deploy private translation Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --request PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/deverve-site-translation" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --form "metadata=@translation-worker-metadata.json;type=application/json" \
            --form "index.js=@workers/site-translation/index.js;type=application/javascript+module")"
          node -e 'const result=JSON.parse(process.argv[1]); if(!result.success) { console.error(JSON.stringify(result.errors)); process.exit(1); } console.log("Private translation Worker deployed:", result.result.id, "deployment:", result.result.deployment_id);' "$response"

      - name: Explain manual deployment requirement when credentials are absent
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        shell: bash
        run: |
          echo "::warning::Automatic Worker deployment skipped because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repository secrets are not configured. The private Worker must be deployed through an authorized Cloudflare connection until those secrets are added."

      - name: Smoke-test the live production translation route
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          http_code="$(curl --silent --show-error --connect-timeout 10 --max-time 45 \
            --output translation-smoke.json --write-out '%{http_code}' \
            --request POST "https://deverve-official.pages.dev/api/translate" \
            --header "Origin: https://deverve-official.pages.dev" \
            --header "sec-fetch-site: same-origin" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data '{"text":"Welcome to De VERVE ZXQDVSEP Shop now.","target_lang":"ur"}')"
          if [ "$http_code" = "429" ]; then
            echo "::warning::Live translation smoke test skipped because the visitor or shared daily inference limit is currently exhausted."
            exit 0
          fi
          if [ "$http_code" != "200" ]; then
            cat translation-smoke.json
            echo "Live translation endpoint returned HTTP $http_code"
            exit 1
          fi
          node -e 'const result=JSON.parse(require("node:fs").readFileSync("translation-smoke.json","utf8")); if(typeof result.translatedText!=="string" || !result.translatedText.includes("De VERVE") || !result.translatedText.includes("ZXQDVSEP")) { console.error("Translation output failed brand/segment preservation:", result); process.exit(1); } console.log("Live in-page translation smoke test passed.");'
