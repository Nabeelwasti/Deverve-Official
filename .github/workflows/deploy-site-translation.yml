name: Deploy private site translation service

on:
  push:
    branches: [main]
    paths:
      - "workers/site-translation/**"
      - ".github/workflows/deploy-site-translation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deverve-site-translation-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate translation Worker
        run: node --check workers/site-translation/index.js

      - name: Prepare private Workers AI binding metadata
        shell: bash
        run: |
          cat > translation-worker-metadata.json <<'EOF'
          {
            "main_module": "index.js",
            "compatibility_date": "2026-11-13",
            "bindings": [
              { "type": "ai", "name": "AI" }
            ],
            "workers_dev": false,
            "preview_urls": false,
            "observability": { "enabled": false }
          }
          EOF

      - name: Deploy private translation Worker
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --request PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/deverve-site-translation" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --form "metadata=@translation-worker-metadata.json;type=application/json" \
            --form "index.js=@workers/site-translation/index.js;type=application/javascript+module")"
          node -e 'const result=JSON.parse(process.argv[1]); if(!result.success) { console.error(JSON.stringify(result.errors)); process.exit(1); } console.log("Private translation Worker deployed:", result.result.id, "deployment:", result.result.deployment_id);' "$response"

      - name: Explain manual deployment requirement when credentials are absent
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
        shell: bash
        run: |
          echo "::warning::Automatic Worker deployment skipped because CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID repository secrets are not configured. The private Worker must be deployed through an authorized Cloudflare connection until those secrets are added."
