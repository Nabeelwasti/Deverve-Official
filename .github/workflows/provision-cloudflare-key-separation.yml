name: Provision separated application secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/provision-cloudflare-key-separation.mjs"
      - ".github/workflows/provision-cloudflare-key-separation.yml"

permissions:
  contents: read

concurrency:
  group: deverve-secret-provisioning
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Provision independent random Cloudflare Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-cloudflare-key-separation.mjs
