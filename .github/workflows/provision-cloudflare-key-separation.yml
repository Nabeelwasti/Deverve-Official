name: Provision separated application secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/provision-cloudflare-key-separation.mjs"
      - ".github/workflows/provision-cloudflare-key-separation.yml"

permissions:
  contents: read

concurrency:
  group: deverve-secret-provisioning
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Provision domain-separated Cloudflare Pages secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_BACKUP_ENCRYPTION_KEY: ${{ secrets.D1_BACKUP_ENCRYPTION_KEY }}
        run: node scripts/provision-cloudflare-key-separation.mjs
