name: Monitor encrypted backup freshness

on:
  workflow_dispatch:
  schedule:
    # Check every six hours so a failed or stale backup is surfaced promptly.
    - cron: "0 */6 * * *"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: deverve-backup-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Check last successful encrypted backup and isolated restore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/backup-health-monitor.mjs
