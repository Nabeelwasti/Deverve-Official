name: Monitor encrypted backup freshness

on:
  workflow_dispatch:
  schedule:
    # Run after the 21:17 UTC backup schedule has had time to complete.
    - cron: "0 22 * * *"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: deverve-backup-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Check last successful encrypted backup and isolated restore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/backup-health-monitor.mjs
