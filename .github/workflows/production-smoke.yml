name: Production deployment smoke checks

on:
  workflow_run:
    workflows: ["Build and type-check"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for production health and verify database connectivity
        shell: bash
        run: |
          set -euo pipefail
          base="https://deverve-official.pages.dev"
          healthy=false
          for attempt in $(seq 1 30); do
            if body="$(curl --fail --silent --show-error --max-time 10 "$base/api/health" 2>/dev/null)"; then
              if [[ "$body" == *'"status":"ok"'* && "$body" == *'"database":"connected"'* ]]; then
                echo "Production health check passed: $body"
                healthy=true
                break
              fi
            fi
            echo "Waiting for Pages deployment and healthy D1 binding (attempt $attempt/30)..."
            sleep 10
          done
          if [[ "$healthy" != true ]]; then
            echo "Production health check did not become healthy within five minutes."
            exit 1
          fi

      - name: Verify Turnstile verifier and Siteverify connectivity
        shell: bash
        run: |
          set -euo pipefail
          verifier="https://deverve-turnstile-verify.wastinabeel99.workers.dev"
          health="$(curl --fail --silent --show-error --max-time 15 "$verifier/health")"
          if [[ "$health" != *'"status":"ok"'* || "$health" != *'"secret_configured":true'* ]]; then
            echo "Turnstile verifier health check failed: $health"
            exit 1
          fi
          status="$(curl --silent --show-error --max-time 15 -o /tmp/turnstile-invalid.json -w '%{http_code}' \
            -X POST "$verifier/" \
            -H 'Origin: https://deverve-official.pages.dev' \
            -H 'Content-Type: application/json' \
            --data '{"token":"deliberately-invalid-production-smoke-token"}')"
          body="$(cat /tmp/turnstile-invalid.json)"
          if [[ "$status" != "403" || "$body" != *'"success":false'* ]]; then
            echo "Turnstile Siteverify negative test failed (HTTP $status): $body"
            exit 1
          fi
          echo "Turnstile verifier is live, its secret binding is present, and Siteverify rejects an invalid token."

      - name: Verify scheduled CNIC retention service bindings
        shell: bash
        run: |
          set -euo pipefail
          url="https://deverve-cnic-retention.wastinabeel99.workers.dev/health"
          body="$(curl --fail --silent --show-error --max-time 15 "$url")"
          if [[ "$body" != *'"status":"ok"'* || "$body" != *'"database_connected":true'* || "$body" != *'"private_storage_binding":true'* || "$body" != *'"closed_request_retention_days":30'* || "$body" != *'"unresolved_request_retention_days":90'* ]]; then
            echo "CNIC retention service health check failed: $body"
            exit 1
          fi
          echo "CNIC retention service has live D1 and private R2 bindings."

      - name: Verify deployed security response headers
        shell: bash
        run: |
          set -euo pipefail
          base="https://deverve-official.pages.dev"
          headers="$(curl --fail --silent --show-error --head --max-time 15 "$base/" | tr -d '\r')"
          required=(
            "X-Content-Type-Options: nosniff"
            "Referrer-Policy: strict-origin-when-cross-origin"
            "X-Frame-Options: DENY"
            "Permissions-Policy: camera=(), microphone=(), geolocation=()"
            "Strict-Transport-Security: max-age=31536000"
          )
          for header in "${required[@]}"; do
            if ! grep -qiF "$header" <<<"$headers"; then
              echo "Missing deployed security header: $header"
              printf '%s\n' "$headers"
              exit 1
            fi
          done
          if ! grep -qiF "Content-Security-Policy: default-src 'self'" <<<"$headers"; then
            echo "Missing expected Content-Security-Policy."
            printf '%s\n' "$headers"
            exit 1
          fi
          echo "All expected security response headers are present."
