name: Production deployment smoke checks

on:
  workflow_run:
    workflows: ["Build and type-check"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  production-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for production health and verify database connectivity
        shell: bash
        run: |
          set -euo pipefail
          base="https://deverve-official.pages.dev"
          healthy=false
          for attempt in $(seq 1 30); do
            if body="$(curl --fail --silent --show-error --max-time 10 "$base/api/health" 2>/dev/null)"; then
              if [[ "$body" == *'"status":"ok"'* && "$body" == *'"database":"connected"'* ]]; then
                echo "Production health check passed: $body"
                healthy=true
                break
              fi
            fi
            echo "Waiting for Pages deployment and healthy D1 binding (attempt $attempt/30)..."
            sleep 10
          done
          if [[ "$healthy" != true ]]; then
            echo "Production health check did not become healthy within five minutes."
            exit 1
          fi

      - name: Verify customer exchange and legacy return routes are deployed and protected
        shell: bash
        run: |
          set -euo pipefail
          base="https://deverve-official.pages.dev"
          for route in "/api/customer/returns" "/api/admin/returns" "/api/customer/exchanges" "/api/admin/exchanges" "/api/admin/inventory" "/api/admin/pos/bootstrap" "/api/admin/pos/summary" "/api/admin/pos/expenses" "/api/admin/vehicles/00000000-0000-4000-8000-000000000000/media"; do
            status="$(curl --silent --show-error --max-time 15 -o /tmp/deverve-route.json -w '%{http_code}' "$base$route")"
            if [[ "$status" != "401" ]]; then
              echo "Expected unauthenticated access to $route to return 401, received HTTP $status:"
              cat /tmp/deverve-route.json
              exit 1
            fi
          done
          echo "Customer exchange and legacy return routes are deployed and require authentication."

      - name: Verify CMS, product SEO, sitemap and owner notification routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://deverve-official.pages.dev"
          products="$(curl --fail --silent --show-error --max-time 15 "$base/api/products")"
          if [[ "$products" != *'"products"'* ]] || ! jq -e '.products | type == "array" and all(.[]; (has("cost_price_paisa") | not) and all(.variants[]?; (has("cost_price_paisa") | not)))' <<<"$products" >/dev/null; then
            echo "Public product catalogue API did not return the expected safe product JSON."
            exit 1
          fi
          status="$(curl --silent --show-error --max-time 15 -o /tmp/deverve-page.json -w '%{http_code}' "$base/api/pages/production-smoke-page-that-does-not-exist")"
          if [[ "$status" != "404" ]]; then
            echo "Expected unpublished/missing CMS page to return 404, received HTTP $status:"
            cat /tmp/deverve-page.json
            exit 1
          fi
          for route in "/api/admin/pages" "/api/admin/navigation" "/api/admin/notifications" "/api/admin/notification-settings"; do
            status="$(curl --silent --show-error --max-time 15 -o /tmp/deverve-admin.json -w '%{http_code}' "$base$route")"
            if [[ "$status" != "401" ]]; then
              echo "Expected unauthenticated access to $route to return 401, received HTTP $status:"
              cat /tmp/deverve-admin.json
              exit 1
            fi
          done
          sitemap="$(curl --fail --silent --show-error --max-time 15 "$base/sitemap.xml")"
          if [[ "$sitemap" != *'<urlset'* || "$sitemap" != *'https://deverve-official.pages.dev/'* ]]; then
            echo "Dynamic sitemap did not contain the expected URL set."
            exit 1
          fi
          echo "CMS public route, protected content APIs, product catalogue and dynamic sitemap passed."

      - name: Verify Turnstile verifier and Siteverify connectivity
        shell: bash
        run: |
          set -euo pipefail
          verifier="https://deverve-turnstile-verify.wastinabeel99.workers.dev"
          health="$(curl --fail --silent --show-error --max-time 15 "$verifier/health")"
          if [[ "$health" != *'"status":"ok"'* || "$health" != *'"secret_configured":true'* ]]; then
            echo "Turnstile verifier health check failed: $health"
            exit 1
          fi
          status="$(curl --silent --show-error --max-time 15 -o /tmp/turnstile-invalid.json -w '%{http_code}' \
            -X POST "$verifier/" \
            -H 'Origin: https://deverve-official.pages.dev' \
            -H 'Content-Type: application/json' \
            --data '{"token":"deliberately-invalid-production-smoke-token"}')"
          body="$(cat /tmp/turnstile-invalid.json)"
          if [[ "$status" != "403" || "$body" != *'"success":false'* ]]; then
            echo "Turnstile Siteverify negative test failed (HTTP $status): $body"
            exit 1
          fi
          echo "Turnstile verifier is live, its secret binding is present, and Siteverify rejects an invalid token."

      - name: Verify scheduled CNIC retention service bindings
        shell: bash
        run: |
          set -euo pipefail
          url="https://deverve-cnic-retention.wastinabeel99.workers.dev/health"
          body="$(curl --fail --silent --show-error --max-time 15 "$url")"
          if [[ "$body" != *'"status":"ok"'* || "$body" != *'"database_connected":true'* || "$body" != *'"private_storage_binding":true'* || "$body" != *'"closed_request_retention_days":30'* || "$body" != *'"unresolved_request_retention_days":90'* ]]; then
            echo "CNIC retention service health check failed: $body"
            exit 1
          fi
          echo "CNIC retention service has live D1 and private R2 bindings."

      - name: Verify public rental settings and fleet pricing endpoint
        shell: bash
        run: |
          set -euo pipefail
          base="https://deverve-official.pages.dev"
          rental_settings="$(curl --fail --silent --show-error --max-time 15 "$base/api/rentals/settings")"
          if ! jq -e '.cnic_uploads_enabled == true' <<<"$rental_settings" >/dev/null; then
            echo "Rental CNIC uploads are not enabled in the public settings response: $rental_settings"
            exit 1
          fi
          fleet="$(curl --fail --silent --show-error --max-time 15 "$base/api/vehicles")"
          if ! jq -e '.vehicles | type == "array" and all(.[]; (.media | type) == "array")' <<<"$fleet" >/dev/null; then
            echo "Public fleet endpoint did not return the expected vehicle galleries: $fleet"
            exit 1
          fi
          echo "Public rental settings and fleet endpoint are healthy."

      - name: Verify deployed security response headers
        shell: bash
        run: |
          set -euo pipefail
          base="https://deverve-official.pages.dev"
          headers="$(curl --fail --silent --show-error --head --max-time 15 "$base/" | tr -d '\r')"
          required=(
            "X-Content-Type-Options: nosniff"
            "Referrer-Policy: strict-origin-when-cross-origin"
            "X-Frame-Options: DENY"
            "Permissions-Policy: camera=(), microphone=(), geolocation=()"
            "Strict-Transport-Security: max-age=31536000"
          )
          for header in "${required[@]}"; do
            if ! grep -qiF "$header" <<<"$headers"; then
              echo "Missing deployed security header: $header"
              printf '%s\n' "$headers"
              exit 1
            fi
          done
          if ! grep -qiF "Content-Security-Policy: default-src 'self'" <<<"$headers"; then
            echo "Missing expected Content-Security-Policy."
            printf '%s\n' "$headers"
            exit 1
          fi
          for directive in "script-src 'self' https://challenges.cloudflare.com" "frame-src 'self' https://challenges.cloudflare.com"; do
            if ! grep -qiF "$directive" <<<"$headers"; then
              echo "Missing Turnstile Content-Security-Policy directive: $directive"
              printf '%s\\n' "$headers"
              exit 1
            fi
          done
          echo "All expected security response headers and Turnstile CSP directives are present."
