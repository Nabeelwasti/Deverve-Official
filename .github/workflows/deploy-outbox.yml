name: Build scheduled outbox Worker bundle

# The outbox changes order/payment state and releases stock. Deploy only as
# an explicit controlled release after migration 0051 and smoke-test approval.
# This workflow only builds an immutable artifact; the authorized Cloudflare API connection performs the upload.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-outbox.yml"
      - "workers/outbox/**"
      - "worker/index.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.worker.json"

permissions:
  contents: read

concurrency:
  group: deverve-outbox-production
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify production reservation-expiry schema before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/355da876-17c4-4762-a59d-bb85f2e4551b/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"sql":"SELECT EXISTS(SELECT 1 FROM pragma_table_info('"'order_inventory_reservations'"') WHERE name='"'expires_at'"') AS has_expiry_column"}')"
          jq -e '.success == true and .result[0].results[0].has_expiry_column == 1' <<<"$response" >/dev/null || {
            echo "::error::Production D1 migration 0051 is not applied or D1 is unavailable. No outbox Worker deployment was made."
            exit 1
          }
      - name: Type-check Worker and application
        run: npm run check
      - name: Build and isolate exact production outbox Worker bundle without deploying
        shell: bash
        run: |
          set -euo pipefail
          rm -rf outbox-worker-bundle .wrangler/outbox-build
          npx --yes wrangler@4.45.0 deploy --dry-run --outdir .wrangler/outbox-build --config workers/outbox/wrangler.toml
          mkdir -p outbox-worker-bundle
          worker_file="$(grep -R -l --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --include='*.js' 'deverve-outbox-drain' . | head -n 1 || true)"
          if [[ -z "$worker_file" ]]; then
            echo "::error::Expected compiled outbox Worker code was not found."
            find . -path './node_modules' -prune -o -path './.git' -prune -o -type f -mmin -5 -size +1k -print
            exit 1
          fi
          cp "$worker_file" outbox-worker-bundle/index.js
          test -s outbox-worker-bundle/index.js
          echo "Verified compiled Worker entrypoint: $worker_file"
          wc -c outbox-worker-bundle/index.js
      - name: Upload immutable outbox Worker bundle for controlled API deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: deverve-outbox-bundle
          path: outbox-worker-bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
