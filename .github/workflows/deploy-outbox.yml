name: Deploy scheduled outbox Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workers/outbox/**"
      - "worker/index.ts"
      - ".github/workflows/deploy-outbox.yml"

permissions:
  contents: read

concurrency:
  group: deverve-outbox-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify production reservation-expiry schema before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/355da876-17c4-4762-a59d-bb85f2e4551b/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"sql":"SELECT EXISTS(SELECT 1 FROM pragma_table_info('"'order_inventory_reservations'"') WHERE name='"'expires_at'"') AS has_expiry_column"}')"
          jq -e '.success == true and .result[0].results[0].has_expiry_column == 1' <<<"$response" >/dev/null || {
            echo "::error::Production D1 migration 0051 is not applied or D1 is unavailable. No outbox Worker deployment was made."
            exit 1
          }
      - name: Type-check Worker and application
        run: npm run check
      - name: Deploy scheduled outbox Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing Cloudflare API token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing Cloudflare account ID"; exit 1; }
          npx --yes wrangler@4.45.0 deploy --config workers/outbox/wrangler.toml
      - name: Verify the five-minute outbox Cron Trigger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 20 \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/deverve-outbox/schedules" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          jq -e '.success == true and any(.result.schedules[]?; .cron == "*/5 * * * *")' <<<"$response" >/dev/null || {
            echo "::error::The scheduled outbox Cron Trigger was not confirmed."
            exit 1
          }
