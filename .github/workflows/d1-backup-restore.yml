name: Encrypted D1 Backup and Restore Drill
on:
  workflow_dispatch:
  schedule:
    # 02:00 Pakistan Standard Time (UTC+5), every day.
    - cron: "0 21 * * *"
permissions:
  contents: read
concurrency:
  group: deverve-d1-backup-restore
  cancel-in-progress: false
jobs:
  encrypted-backup-and-restore:
    name: Export, encrypt, store and restore-test production D1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: "355da876-17c4-4762-a59d-bb85f2e4551b"
      D1_DATABASE_NAME: "deverve-production"
      D1_BACKUP_R2_BUCKET: "deverve-db-backups"
      D1_BACKUP_ENCRYPTION_KEY: ${{ secrets.D1_BACKUP_ENCRYPTION_KEY }}
      D1_BACKUP_KEY_ID: "deverve-d1-key-v1"
    steps:
      - name: Check out protected main source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate backup prerequisites
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          [[ "$D1_BACKUP_ENCRYPTION_KEY" =~ ^[A-Fa-f0-9]{64}$ ]] || { echo "::error::Add D1_BACKUP_ENCRYPTION_KEY (64 hex characters) in GitHub Actions secrets. Generate it with openssl rand -hex 32."; exit 1; }
          echo "::notice::CLOUDFLARE_API_TOKEN must have D1 Edit and R2 Object Read and Write permissions."
      - name: Run encrypted backup and isolated restore drill
        run: node scripts/d1-backup-restore.mjs
